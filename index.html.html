.tabs button.on{background:var(--ac);color:#fff}#toast{position:fixed;right:14px;bottom:14px;z-index:50;display:flex;flex-direction:column;gap:6px}#toast div{background:var(--c-Critical);color:#fff;padding:9px 12px;border-radius:8px;max-width:300px;box-shadow:0 4px 14px #0004}
.in{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;align-items:end}.in label{font-size:12px;color:var(--mu)}.in input,.in select{width:100%}
@media(max-width:820px){.gisg{grid-template-columns:1fr}}

 <div class="ac">

<script>
const $=s=>document.querySelector(s),r1=x=>Math.round(x*10)/10,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),avg=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LOGO=`<svg viewBox="0 0 48 48" width="40" height="40" aria-label="ClimaSite logo"><rect width="48" height="48" rx="11" fill="#0b7285"/><path d="M10 38V22l8-5v21M18 38V14l9-4v28M27 38V20l11 4v14M9 38h31" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M30 12c5-4 11-3 12 1-3 4-9 4-12-1z" fill="#69db7c"/><circle cx="12" cy="11" r="3.5" fill="#ffd43b"/></svg>`;
$("#lg1").innerHTML=LOGO.replace('width="40" height="40"','width="64" height="64"');
const DEF=[{id:1,name:"Upper Hill Tower",city:"Nairobi",lat:-1.2921,lon:36.8219,floors:8,prog:.5,T:21,H:62,S:48,W:14},{id:2,name:"Nyali Apartments",city:"Mombasa",lat:-4.0435,lon:39.6682,floors:6,prog:.7,T:29,H:78,S:60,W:22},{id:3,name:"Lakeside Mall",city:"Kisumu",lat:-.0917,lon:34.768,floors:4,prog:.3,T:26,H:70,S:66,W:12},{id:4,name:"Tech Park",city:"Nakuru",lat:-.3031,lon:36.08,floors:5,prog:.6,T:22,H:58,S:42,W:20},{id:5,name:"Highlands Housing Estate",city:"Eldoret",lat:.5143,lon:35.2698,floors:3,prog:.8,T:19,H:68,S:55,W:16}];
const DU=[{name:"Simon Nganga",id:"24ZAD109369",role:"Administrator",email:"simon.nganga@example.com",phone:"",active:true},{name:"Amina Otieno",id:"24ZAD104512",role:"Site Manager",email:"amina@example.com",phone:"",active:true},{name:"Peter Kamau",id:"24ZAD107788",role:"Engineer",email:"peter@example.com",phone:"",active:true},{name:"Grace Wanjiru",id:"24ZAD101234",role:"Viewer",email:"grace@example.com",phone:"",active:true}];
const ROLEP={Administrator:["view","ack","sites","reports","users","settings"],"Site Manager":["view","ack","sites","reports"],Engineer:["view","ack","reports"],Viewer:["view"]};
const PL=[["view","View dashboards"],["ack","Acknowledge alerts"],["sites","Manage sites"],["reports","Generate reports"],["users","Manage users"],["settings","System settings & backups"]];
const ACT={Rainfall:"Suspend concrete pours and excavation; cover materials; check drainage and silt fences.",Wind:"Halt crane lifts and work at height; secure scaffolding, sheeting and loose materials.",Soil:"Inspect excavations and retaining walls for instability; pause earthworks until soil drains.",Heat:"Reschedule heavy work to early morning; enforce hydration and shade breaks."};
const RK={Low:0,Moderate:1,High:2,Critical:3},LV=["Low","Moderate","High","Critical"];
const S={user:null,view:"dashboard",cur:1,min:720,tick:0,aid:0,nid:0,panel:null,layer:"Risk",vb:[0,0,460,500],rt:"daily",af:"active",alerts:[],log:[],notifs:[],perf:[],
 set:Object.assign({unit:"C",theme:"auto",speed:3000,notify:true,rain:10,wind:40},LS.g("cr_set",{})),users:LS.g("cr_users",DU),sites:LS.g("cr_sites",DEF).map(x=>({...x})),
 apis:[{n:"Weather data API",st:"ok",ms:60},{n:"GIS map service",st:"ok",ms:60},{n:"BIM model server",st:"ok",ms:60}]};
const can=p=>S.user&&ROLEP[S.user.role].includes(p),cur=()=>S.sites.find(s=>s.id===S.cur)||S.sites[0];
const clock=d=>{const m=S.min%1440;return `${d?"Day "+(Math.floor(S.min/1440)+1)+" ":""}${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`};
const T=c=>S.set.unit==="F"?r1(c*9/5+32)+"°F":r1(c)+"°C",bd=l=>`<span class="bd ${l}">${l}</span>`;
const logA=m=>{S.log.unshift({t:clock(true),u:S.user?S.user.name:"System",m});S.log.length=Math.min(S.log.length,80)};
const sys=m=>{S.notifs.unshift({id:++S.nid,t:clock(),kind:"System update",msg:m,read:false})};
sys("System v2.4 installed: improved risk classification model");sys("Nightly data backup completed successfully");sys("GIS base layer refreshed");
/* ---------- simulation ---------- */
function stepSite(s){const m=(S.min/60)%24,p=s.cur,base=s.T+5*Math.sin((m-9)*Math.PI/12);
 if(s.rl>0)s.rl--;else if(Math.random()<.035){s.rl=3+Math.floor(Math.random()*6);s.rp=2+Math.random()*24}
 if(s.gl>0)s.gl--;else if(Math.random()<.04)s.gl=3+Math.floor(Math.random()*4);
 const R=s.rl>0?r1(s.rp*(.5+Math.random()*.7)):0,sp=p?p.S:s.S;
 const c={T:r1(base-(R?2.5:0)+(Math.random()-.5)*.8),H:Math.round(clamp(s.H+(R?18:0)-(base-s.T)*1.6+(Math.random()-.5)*4,25,99)),R,S:r1(clamp(sp+R*.12-(sp-s.S)*.04+(Math.random()-.5)*.4,8,98)),W:r1(clamp(s.W+(s.gl>0?24:0)+(R?6:0)+(Math.random()-.4)*7,2,95))};
 c.G=r1(c.W*1.25+Math.random()*5);c.D=Math.round((((p?p.D:200)+(Math.random()-.5)*30)%360+360)%360);
 s.cur=c;s.hist.push({t:clock(),...c});if(s.hist.length>60)s.hist.shift()}
function assess(s){const c=s.cur,th=S.set,pts={Rainfall:c.R>=th.rain*2.5?3:c.R>=th.rain?2:c.R>=th.rain/4?1:0,Wind:c.W>=th.wind*1.5?3:c.W>=th.wind?2:c.W>=th.wind*.6?1:0,Soil:c.S>=85?3:c.S>=72?2:c.S>=60||c.S<12?1:0,Heat:c.T>=36?2:c.T>=32?1:0};
 const sc=pts.Rainfall+pts.Wind+pts.Soil+pts.Heat;return{score:sc,pts,lvl:sc>=6?"Critical":sc>=4?"High":sc>=2?"Moderate":"Low",drivers:Object.entries(pts).filter(x=>x[1]).sort((a,b)=>b[1]-a[1])}}
const acts=n=>n.drivers.length?n.drivers.map(d=>ACT[d[0]]).join(" "):"Continue normal operations with routine monitoring.";
function pushA(s,level,type,msg,action){const a={id:++S.aid,t:clock(),site:s.name,level,type,msg,action,ack:false};S.alerts.unshift(a);if(S.alerts.length>120)S.alerts.pop();
 if(S.set.notify){S.notifs.unshift({id:++S.nid,t:a.t,kind:"Alert",msg:`${s.name}: ${type}`,read:false});const d=document.createElement("div");d.textContent=`${level}: ${s.name} – ${type}`;$("#toast").append(d);setTimeout(()=>d.remove(),4500)}}
function evalRisk(s,live){const p=s.risk,n=assess(s);s.risk=n;if(!live)return;const th=S.set,c=s.cur;
 if((!p||RK[n.lvl]>RK[p.lvl])&&RK[n.lvl]>=2)pushA(s,n.lvl,"Risk escalation",`Risk raised to ${n.lvl} (${n.drivers.map(d=>d[0]).join(", ")})`,acts(n));
 if(c.R>=th.rain&&S.tick-(s.lr??-99)>12){s.lr=S.tick;pushA(s,c.R>=th.rain*2.5?"Critical":"High","Heavy rainfall warning",`Rainfall ${c.R} mm/h exceeds threshold of ${th.rain} mm/h`,ACT.Rainfall)}
 if(c.W>=th.wind&&S.tick-(s.lw??-99)>12){s.lw=S.tick;pushA(s,c.W>=th.wind*1.5?"Critical":"High","High wind warning",`Wind ${c.W} km/h exceeds threshold of ${th.wind} km/h`,ACT.Wind)}}
function initLive(s){s.hist=[];s.cur=null;s.rl=0;s.gl=0;s.sensors=["Temp/Humidity sensor","Rain gauge","Soil moisture probe","Anemometer"].map(n=>({n,st:"ok",ms:50}));const m0=S.min;for(let i=0;i<40;i++){S.min=m0-(40-i)*10;stepSite(s)}S.min=m0;evalRisk(s,false)}
const perfAt=f=>clamp(100-avg(S.sites.map(s=>assess({cur:f(s)}).score))*10,0,100);
S.sites.forEach(initLive);for(let i=0;i<40;i++)S.perf.push(perfAt(s=>s.hist[Math.min(i,s.hist.length-1)]));
function sens(){const f=(o,nm)=>{if(o.st==="ok"){if(Math.random()<.005){o.st=Math.random()<.5?"degraded":"offline";sys(`${nm}: ${o.n} ${o.st==="offline"?"went offline":"interrupted"}`)}}else if(Math.random()<.1){o.st="ok";sys(`${nm}: ${o.n} restored`)}o.ms=Math.round(25+Math.random()*150)};S.sites.forEach(s=>s.sensors.forEach(o=>f(o,s.name)));S.apis.forEach(o=>f(o,"Data source"))}
function tick(){if(!S.user)return;S.min+=10;S.tick++;S.sites.forEach(s=>{stepSite(s);evalRisk(s,true)});sens();S.perf.push(perfAt(s=>s.cur));if(S.perf.length>60)S.perf.shift();renderBar();renderSide();
 const a=document.activeElement;if(S.view==="sites"){const e=$("#sitesLive");if(e)e.innerHTML=sitesTable();return}if(["users","settings"].includes(S.view))return;if(a&&$("#main").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
let TM;const start=()=>{clearInterval(TM);TM=setInterval(tick,S.set.speed)};
/* ---------- charts & map ---------- */
function line(se,o={}){const W=600,H=o.h||170,L=36,R=8,Tp=8,B=8,all=se.flatMap(x=>x.d);let mn=o.min??Math.min(...all),mx=o.max??Math.max(...all);if(mx-mn<1)mx=mn+1;
 const n=se[0].d.length,x=i=>L+i*(W-L-R)/Math.max(n-1,1),y=v=>H-B-(v-mn)/(mx-mn)*(H-Tp-B);let g="";
 for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--bd)"/><text x="${L-4}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--mu)">${r1(v)}</text>`}
 se.forEach(q=>g+=`<polyline fill="none" stroke="${q.c}" stroke-width="2" ${q.dash?'stroke-dasharray="5 4"':""} points="${q.d.map((v,i)=>x(i)+","+y(clamp(v,mn,mx))).join(" ")}"/>`);

V.settings=()=>{const u=S.user,o=(k,v,l)=>`<option value="${v}"${S.set[k]==v?" selected":""}>${l}</option>`;return `<h2>Settings</h2><div class="grid m2"><div class="card"><h2>Account</h2><p><b>${esc(u.name)}</b> · ${esc(u.id)} · ${bd2(u.role)}</p><div class="in"><div><label for="pe">Email</label><input id="pe" value="${esc(u.email)}"></div><div><label for="pp">Phone</label><input id="pp" value="${esc(u.phone)}"></div><button class="p" data-a="saveprof">Save profile</button></div><div id="pm" class="mu" style="margin-top:8px"></div></div>

 ${can("settings")?`<div class="card"><h2>System backup &amp; restore</h2><textarea id="bk" readonly aria-label="Backup data">${esc(JSON.stringify({set:S.set,users:S.users,sites:defs()}))}</textarea><div class="ctl"><button data-a="copybk">Copy backup</button><button class="d" data-a="reset">Reset to defaults</button></div><textarea id="rs" placeholder="Paste a backup here to restore" aria-label="Restore data"></textarea><div class="ctl"><button class="p" data-a="restore">Restore backup</button><span id="bm" class="mu"></span></div></div>`:""}`};

function renderBar(){const u=S.user,un=S.notifs.filter(x=>!x.read).length,ini=u.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
 const np=`<div class="pn"><div class="hd"><b>Notifications</b><button data-a="readall">Mark all read</button></div>${S.notifs.slice(0,15).map(x=>`<div class="nt ${x.read?"":"u"}"><b>${x.kind}</b> <span class="mu">${x.t}</span><div>${esc(x.msg)}</div></div>`).join("")}</div>`;
 const pp=`<div class="pn"><b>${esc(u.name)}</b><div class="mu">ID ${esc(u.id)}<br>Role: ${esc(u.role)}<br>${esc(u.email)}${u.phone?"<br>"+esc(u.phone):""}</div><div class="ctl"><button data-a="nav" data-v="settings">Account settings</button><button data-a="logout">Log out</button></div></div>`;

const A={nav(v){S.view=v;S.panel=null;$("#side").classList.remove("open");renderBar();render();scrollTo(0,0)},site(v){S.cur=+v;render()},mon(v){S.cur=+v;A.nav("dashboard")},

 fit(){const p=S.sites.map(s=>px(s.lon,s.lat)),xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);const w=Math.max(Math.max(...xs)-Math.min(...xs)+160,Math.max(Math.max(...ys)-Math.min(...ys)+160,0)*ASP,200),h=w/ASP;S.vb=[(Math.min(...xs)+Math.max(...xs))/2-w/2,(Math.min(...ys)+Math.max(...ys))/2-h/2,w,h];render()},

 panel(v){S.panel=S.panel===v?null:v;renderBar()},readall(){S.notifs.forEach(n=>n.read=true);renderBar()},menu(){$("#side").classList.toggle("open")},
 bs(v){S.bs=v;render()},copy(){const t=$("#csv");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}logA("Exported report: "+S.rt)},
 copybk(){const t=$("#bk");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}$("#bk").focus()},

 addsite(){const n=$("#ns1").value.trim(),c=$("#ns2").value.trim(),la=parseFloat($("#ns3").value),lo=parseFloat($("#ns4").value),f=Math.round($("#ns5").value),m=$("#sm");
  if(!n||!c||isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180||!(f>=1))return m.textContent="Enter a name, city, valid coordinates and number of floors.";
  const s={id:Math.max(0,...S.sites.map(x=>x.id))+1,name:n,city:c,lat:la,lon:lo,floors:Math.min(f,30),prog:.1,T:24,H:65,S:50,W:15};initLive(s);S.sites.push(s);S.cur=s.id;LS.s("cr_sites",defs());logA("Registered site "+n);A.fit();A.nav("sites")},

 utog(v){const u=S.users[+v];u.active=!u.active;LS.s("cr_users",S.users);logA(`${u.active?"Activated":"Deactivated"} ${u.name}`);render()},

 restore(){try{const d=JSON.parse($("#rs").value);if(!d.sites||!d.users||!d.set)throw 0;LS.s("cr_sites",d.sites);LS.s("cr_users",d.users);LS.s("cr_set",d.set);$("#bm").textContent="Restored. Reloading…";setTimeout(()=>location.reload(),600)}catch(e){$("#bm").textContent="Invalid backup data."}},

/* ---------- auth ---------- */
function auth(m){$("#fLogin").hidden=m!=="login";$("#fReg").hidden=m!=="reg";$("#fForgot").hidden=m!=="forgot";["err","rm","fm"].forEach(i=>$("#"+i).hidden=true)}
const rem=LS.g("cr_rem",null);if(rem){$("#lu").value=rem.u;$("#lr").checked=true}
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
 if(f==="fLogin"){const n=$("#lu").value.trim().toLowerCase(),i=$("#li").value.trim().toUpperCase(),u=S.users.find(x=>x.name.toLowerCase()===n&&x.id.toUpperCase()===i);
  if(!u||!u.active){const m=$("#err");m.textContent=u&&!u.active?"This account has been deactivated. Contact an administrator.":"Invalid username or ID. Please check your credentials and try again.";m.hidden=false;return}
  LS.s("cr_rem",$("#lr").checked?{u:u.name}:null);S.user=u;$("#auth").hidden=true;$("#app").hidden=false;S.view="dashboard";logA("Logged in");applyTheme();renderBar();render();start()}
 if(f==="fReg"){const n=$("#rn").value.trim(),i=$("#ri").value.trim().toUpperCase(),em=$("#re").value.trim(),m=$("#rm");m.className="err";m.hidden=false;
  if(n.length<3)return m.textContent="Enter your full name.";if(!/^\d{2}[A-Z]{3}\d{6}$/.test(i))return m.textContent="ID must look like 24ZAD109369.";if(!/^\S+@\S+\.\S+$/.test(em))return m.textContent="Enter a valid email address.";
  if(S.users.some(u=>u.id===i||u.name.toLowerCase()===n.toLowerCase()))return m.textContent="An account with that name or ID already exists.";
  S.users.push({name:n,id:i,role:$("#rr").value,email:em,phone:"",active:true});LS.s("cr_users",S.users);m.className="okm";m.textContent="Account created. You can now log in.";$("#lu").value=n;$("#li").value=i;setTimeout(()=>auth("login"),1200)}
 if(f==="fForgot"){const m=$("#fm");m.hidden=false;m.textContent=S.users.some(u=>u.name.toLowerCase()===$("#fu").value.trim().toLowerCase())?"Reset instructions have been sent to the contact registered for this account. Your ID is the one issued to you (format 24ZAD######).":"If that username exists, reset instructions have been sent."}});
